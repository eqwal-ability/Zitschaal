<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Seating Configurator – Eqwal Ability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003151; --navy-70:#4d6f85; --gold:#CEA434; --gold-dk:#b88f26;
    --circle:#F5F5F3; --line:#C5D0D8; --muted:#7f8fa0; --red:#C53030;
    --white:#fff; --r:4px;
    --serif:'Fraunces','Georgia',serif; --sans:'Noto Sans',system-ui,-apple-system,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:var(--sans);color:var(--navy);background:var(--white);min-height:100vh;overflow-x:hidden;position:relative;}
  button,input,select{font:inherit;color:inherit;}

  /* ---------- decorative circle (left) ---------- */
  .bg-circle{position:fixed;z-index:0;border-radius:50%;background:var(--circle);
    width:62.2vw;height:62.2vw;left:-22.9vw;top:-7.5vw;pointer-events:none;transition:opacity .35s;}
  body.step-3 .bg-circle{opacity:0;}

  /* ---------- logo ---------- */
  .logo{position:absolute;z-index:3;top:clamp(18px,2.9vw,31px);left:clamp(16px,2.9vw,55px);width:clamp(120px,11.4vw,219px);}
  .logo img{width:100%;height:auto;display:block;}

  /* ---------- page frame ---------- */
  .page{position:relative;z-index:1;min-height:100vh;padding:clamp(20px,min(4.4vw,6vh),84px) clamp(16px,4vw,64px) 20px;}
  .layout{display:grid;grid-template-columns:50% 50%;max-width:1920px;margin:0 auto;}
  .hero{grid-column:1;display:flex;align-items:flex-start;justify-content:center;
    /* start below the logo: logo top + logo height + 24px, minus the page's own top padding */
    padding-top:max(0px,calc(clamp(18px,2.9vw,31px) + clamp(120px,11.4vw,219px) * .466 + 24px - clamp(20px,min(4.4vw,6vh),84px)));}
  .hero img{width:min(29vw,560px,calc((100vh - clamp(18px,2.9vw,31px) - clamp(120px,11.4vw,219px) * .466 - 60px) * .894));height:auto;margin-left:-4vw;}
  .main{grid-column:2;max-width:820px;}

  /* header: title + tabs */
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(24px,min(1.75vw,3.3vh),34px);letter-spacing:-.005em;line-height:1.2;}
  .tabs{display:flex;justify-content:space-between;width:clamp(400px,38vw,730px);max-width:100%;margin:clamp(14px,2.6vh,34px) 0 clamp(16px,3vh,36px);}
    .tab{flex:0 0 auto;text-align:center;background:none;border:none;cursor:pointer;
    font-size:clamp(16px,min(1.1vw,2vh),21px);color:var(--navy);padding:4px 0;position:relative;white-space:nowrap;}
  .tab.active{color:var(--gold);font-weight:700;}
  .tab:disabled{cursor:not-allowed;opacity:.45;}
  .tab:not(.active):not(:disabled):hover{color:var(--gold-dk);}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:2px;}
  .tab .short{display:none;}

  /* step 3 – front page style, centered */
  body.step-3 .layout{grid-template-columns:1fr;}
  body.step-3 .hero{display:none;}
  body.step-3 .main{grid-column:1;max-width:none;}
  body.step-3 .head{text-align:center;display:flex;flex-direction:column;align-items:center;}
  body.step-3 .tabs{width:clamp(320px,23.5vw,452px);margin-top:clamp(10px,1.6vh,22px);}
  body.step-3 .tab .long{display:none;} body.step-3 .tab .short{display:inline;}

  body.step-2 .hero{display:none;}
  .wo.invalid,.cards.invalid{outline:2px solid var(--red);outline-offset:6px;border-radius:4px;}
  .step{display:none;animation:fade .3s ease;}
  .step.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ---------- form rows ---------- */
  .rows{display:flex;flex-direction:column;gap:clamp(6px,1.1vh,14px);}
  .row{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;min-height:34px;font-size:clamp(15px,min(1vw,1.9vh),19px);}
  .row > .lbl{flex:0 0 clamp(130px,9.5vw,180px);}
  #step-2 .row > .lbl{flex-basis:auto;margin-right:6px;}
  .row input.txt{flex:1 1 220px;max-width:420px;height:clamp(32px,3.9vh,40px);border:1px solid var(--line);border-radius:var(--r);
    padding:0 12px;font-size:16px;background:#fff;transition:border-color .15s,box-shadow .15s;}
  .row input.txt:focus{outline:none;border-color:var(--navy-70);box-shadow:0 0 0 3px rgba(206,164,52,.25);}
  .req{color:var(--navy);}
  .invalid{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(197,48,48,.12)!important;}

  /* Yes / No segmented */
  .yn{display:inline-flex;gap:6px;}
  .yn input{position:absolute;opacity:0;pointer-events:none;}
  .yn label{display:inline-block;min-width:54px;text-align:center;padding:3px 14px;border:1px solid var(--line);
    border-radius:20px;cursor:pointer;font-size:15px;transition:all .15s;user-select:none;background:#fff;}
  .yn label:hover{border-color:var(--navy-70);}
  .yn input:checked + label{background:var(--navy);border-color:var(--navy);color:#fff;}
  .yn input:focus-visible + label{outline:2px solid var(--gold);outline-offset:2px;}
  .q{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;}

  /* square checks (scan source, width/offset) */
  .sq{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .sq input{position:absolute;opacity:0;pointer-events:none;}
  .sq .box{width:16px;height:16px;border:1.5px solid var(--navy);border-radius:2px;display:inline-grid;place-items:center;background:#fff;flex-shrink:0;transition:background .15s;}
  .sq input:checked + .box{background:var(--navy);}
  .sq input:checked + .box::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:none;border-right:none;transform:translateY(-1px) rotate(-45deg);}
  .sq input:focus-visible + .box{outline:2px solid var(--gold);outline-offset:2px;}

  /* dates */
  .dates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 20px;margin-top:clamp(16px,3vh,40px);}
  .dates label{display:flex;flex-direction:column;gap:4px;font-size:clamp(15px,min(1vw,1.9vh),19px);}
  .dates input{height:clamp(34px,4.1vh,44px);border:1px solid var(--line);border-radius:var(--r);padding:0 12px;font-size:15px;background:#fff;width:100%;min-width:0;}
  .dates input:focus{outline:none;border-color:var(--navy-70);box-shadow:0 0 0 3px rgba(206,164,52,.25);}

  /* scale scan */
  .cm-inline{display:inline-flex;align-items:baseline;gap:6px;}
  .cm-inline input{width:90px;border:none;border-bottom:2px dotted var(--navy-70);padding:2px 4px;font-size:16px;text-align:center;background:transparent;}
  .cm-inline input:focus{outline:none;border-bottom-color:var(--gold);}
  .wo{display:inline-flex;gap:28px;margin-left:clamp(0px,3vw,60px);transition:opacity .2s;}
  .wo[hidden]{display:none;}

  /* buttons */
  .actions{display:flex;justify-content:flex-end;align-items:center;gap:16px;flex-wrap:wrap;margin-top:clamp(20px,4vh,56px);}
  .btn{display:inline-flex;align-items:center;gap:8px;height:clamp(40px,4.6vh,48px);padding:0 28px;border:none;border-radius:var(--r);
    background:var(--gold);color:var(--navy);font-size:14px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;
    box-shadow:0 1px 2px rgba(0,49,81,.12);transition:background .15s,transform .1s;}
  .btn b{font-weight:700;}
  .btn:hover{background:var(--gold-dk);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--navy);outline-offset:3px;}
  .btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--circle);}
  .msg{color:var(--red);font-size:14px;min-height:20px;}

  /* ---------- sizing drawings ---------- */
  .drawings{display:grid;grid-template-columns:448fr 317fr 470fr 361fr;gap:40px;align-items:start;
    width:100%;max-width:max(640px,calc((100vh - 470px) * 2.687 + 120px));margin-left:auto;margin-right:auto;
    margin-top:clamp(12px,2vh,28px);}
  .drawing{position:relative;container-type:inline-size;}
  .drawing img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}
  .drawing .cap{display:none;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .fld{position:absolute;}
  .fld input{position:absolute;inset:0;width:100%;height:100%;border:1.5px solid transparent;border-radius:2px;
    background:transparent;text-align:center;padding:0 22% 18% 4%;font-size:var(--mfs,16px);font-weight:600;color:var(--navy);
    transition:border-color .15s,background .15s;}
  .fld input:hover{border-color:rgba(0,49,81,.25);}
  .fld input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.6);}
  .fld .star{position:absolute;top:-2px;right:6%;font-size:calc(var(--mfs,16px) * 1.3);font-weight:700;color:var(--navy);pointer-events:none;line-height:1;}
  .fld.has-value .star{color:var(--gold);}
  .fld input.invalid{border-color:var(--red)!important;background:rgba(197,48,48,.06);}
  .drawing svg.live{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
  .tilt{position:absolute;}
  .tilt input{position:absolute;opacity:0;pointer-events:none;}
  /* inset by the drawn border (~2.5 of 37px) so the black border of the drawing stays visible */
  .tilt label{position:absolute;inset:7%;cursor:pointer;}
  .tilt label:hover{background:rgba(206,164,52,.18);}
  .tilt input:checked + label{background:var(--gold);}
  .tilt input:focus-visible + label{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- step 3: backing material cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,3vw,60px);max-width:1500px;margin:clamp(10px,3vh,48px) auto 0;}
  .card{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2vh,32px);padding:8px;border-radius:8px;}
  .card .vis{position:relative;width:100%;max-width:min(411px,calc((100vh - 390px) * .774));aspect-ratio:411/531;display:grid;place-items:end center;}
  .card .vis::before{content:"";position:absolute;left:0;right:5%;bottom:0;aspect-ratio:1;border-radius:50%;background:var(--circle);
    transition:background .2s,box-shadow .2s;}
  .card img{position:relative;width:100%;height:auto;transition:transform .25s;}
  .card:hover img{transform:translateY(-6px);}
  .card .name{font-size:clamp(18px,1.6vw,30px);}
  .card[aria-checked="true"] .vis::before{background:#F6EEDB;}
  .card[aria-checked="true"] .name{color:var(--gold);font-weight:700;}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:4px;}
  /* push drawings down so the seat base lines align (base y: 455, 457, 386, 234 px) */
  @media (min-width:1101px){
    .drawing:nth-child(1){padding-top:0.446%;}
    .drawing:nth-child(3){padding-top:15.106%;}
    .drawing:nth-child(4){padding-top:61.773%;}
  }
  body.step-3 .actions{justify-content:center;margin-top:clamp(12px,2.5vh,40px);}

  /* ---------- responsive ---------- */
  @media (max-width:1280px){
    .dates{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:1100px){
    .drawings{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;max-width:none;}
    .drawing .cap{display:block;}
  }
  @media (max-width:900px){
    .bg-circle{width:150vw;height:150vw;left:-75vw;top:-95vw;}
    .page{padding-top:clamp(96px,22vw,130px);}
    .layout{grid-template-columns:1fr;}
    .hero{display:none;}
    .main{grid-column:1;max-width:none;}
    .tab{font-size:15px;}
    .tabs{width:100%;padding:0 4px;border-bottom:1px solid var(--line);}
    .tab.active::after{content:"";position:absolute;left:-6px;right:-6px;bottom:-1px;height:2px;background:var(--gold);}
    .tab .long{display:none;} .tab .short{display:inline;}
    body.step-3 .tabs{width:100%;}
    .drawings{max-width:none;gap:24px;}
    .row > .lbl{flex-basis:100%;margin-bottom:-6px;font-weight:600;font-size:15px;}
    .row input.txt{max-width:none;}
    .wo{margin-left:0;}
    .actions{justify-content:stretch;}
    .actions .msg{flex-basis:100%;min-height:0;}
    .actions .btn{flex:1;justify-content:center;}
    .cards{grid-template-columns:1fr;max-width:360px;}
    .card{flex-direction:column;gap:8px;}
  }
  @media (max-width:560px){
    .drawings{grid-template-columns:1fr;}
    .dates{grid-template-columns:1fr 1fr;gap:14px;}
    .dates input{font-size:14px;padding:0 8px;}
  }

</style>
</head>

    <main class="main">
      <div class="head">
        <h1 id="title">Customize your seating.</h1>
        <nav class="tabs" role="tablist" aria-label="Configurator steps">
          <button class="tab active" role="tab" data-go="1" aria-selected="true">Patient data</button>
          <button class="tab" role="tab" data-go="2" aria-selected="false">Sizing</button>
          <button class="tab" role="tab" data-go="3" aria-selected="false"><span class="long">Backing material</span><span class="short">Backing</span></button>
        </nav>
      </div>

      <!-- ================= STEP 1: PATIENT DATA ================= -->
      <section class="step active" id="step-1" role="tabpanel" aria-label="Patient data">
        <div class="rows">
          <div class="row"><label class="lbl" for="cpo">CPO:<span class="req">*</span></label>
            <input class="txt" id="cpo" name="CPO" data-label="CPO" required autocomplete="off"></div>
          <div class="row"><label class="lbl" for="pf">PF Number:<span class="req">*</span></label>
            <input class="txt" id="pf" name="PF Number" data-label="PF Number" required autocomplete="off"></div>
          <div class="row"><label class="lbl" for="fname">First name:</label>
            <input class="txt" id="fname" data-label="First name" autocomplete="off"></div>
          <div class="row"><label class="lbl" for="sname">Surname:</label>
            <input class="txt" id="sname" data-label="Surname" autocomplete="off"></div>
          <div class="row"><label class="lbl" for="insz">INSZ/NISS:</label>
            <input class="txt" id="insz" data-label="INSZ/NISS" inputmode="numeric" autocomplete="off"></div>
          <div class="row"><label class="lbl" for="tel">Tel.:</label>
            <input class="txt" id="tel" type="tel" data-label="Tel." autocomplete="off"></div>
          <div class="row"><span class="lbl" style="flex-basis:auto">Medical prescription?</span>
            <span class="yn" data-label="Medical prescription" data-name="presc"></span></div>
          <div class="row"><span class="lbl" style="flex-basis:auto">In demand?</span>
            <span class="yn" data-label="In demand" data-name="demand"></span></div>
          <div class="row"><span class="lbl" style="flex-basis:auto">Urgent?</span>
            <span class="yn" data-label="Urgent" data-name="urgent"></span></div>
        </div>

        <div class="dates">
          <label>Date*<input type="date" id="d-date" data-label="Date" required></label>
          <label>First fitting*<input type="date" id="d-fit1" data-label="First fitting" required></label>
          <label>Second fitting<input type="date" id="d-fit2" data-label="Second fitting"></label>
          <label>Delivery<input type="date" id="d-deliv" data-label="Delivery"></label>
        </div>

        <div class="actions">
          <span class="msg" aria-live="polite"></span>
          <button class="btn" data-next="2"><b>Next:</b> Sizing</button>
        </div>
      </section>

      <!-- ================= STEP 2: SIZING (questions) ================= -->
      <section class="step" id="step-2" role="tabpanel" aria-label="Sizing">
        <div class="rows">
          <div class="row"><span class="lbl">Scan</span>
            <span class="q">
              <label class="sq"><input type="radio" name="scan" value="via Captor"><span class="box"></span>via Captor</label>
              <label class="sq"><input type="radio" name="scan" value="via mail positionering"><span class="box"></span>via mail positionering</label>
            </span></div>
          <div class="row" style="gap:12px 48px">
            <span class="q"><span>Make form symmetrical?</span><span class="yn" data-label="Make form symmetrical" data-name="symform"></span></span>
            <span class="q"><span>Make walls symmetrical?</span><span class="yn" data-label="Make walls symmetrical" data-name="symwalls"></span></span>
          </div>
          <div class="row"><label class="lbl" for="scale">Scale scan</label>
            <span class="cm-inline"><input id="scale" inputmode="decimal" autocomplete="off" aria-label="Scale scan in cm"><span>cm</span></span>
            <span class="wo" id="wo" hidden>
              <label class="sq"><input type="radio" name="scaleType" value="width"><span class="box"></span>width</label>
              <label class="sq"><input type="radio" name="scaleType" value="offset"><span class="box"></span>offset</label>
            </span></div>
        </div>
      </section>
    </main>
  </div>

  <!-- step 2 drawings span the full page width -->
  <section class="step" id="step-2b" aria-label="Measurements">
    <div class="drawings" id="drawings"></div>
    <div class="actions" style="margin-top:clamp(10px,1.6vh,24px)">
      <span class="msg" aria-live="polite"></span>
      <button class="btn" data-next="3"><b>Next:</b> Backing material</button>
    </div>
  </section>

  <!-- ================= STEP 3: BACKING MATERIAL ================= -->

    // cushion fill: everything right of / below the chosen contour (default: deepest)
    var fillPts=CONTOURS[shape||'3'];
    el('path',{d:smooth(fillPts)+' L300,225 L300,400 L140,400 L140,'+fillPts[0][1]+' Z',fill:FILL,'clip-path':'url(#cushionClip)'});
    if(shape){
      el('path',{d:smooth(CONTOURS[shape]),fill:'none',stroke:INK,'stroke-width':3.2,'stroke-linecap':'round'});
    } else {
      ['1','2','3'].forEach(function(k){
        el('path',{d:smooth(CONTOURS[k]),fill:'none',stroke:INK,'stroke-width':2.4,'stroke-linecap':'round','stroke-dasharray':'0.5 7.5'});
      });
    }
    // 1 / 2 / 3 boxes and labels
    [['1',88],['2',134],['3',180]].forEach(function(b){
      el('rect',{x:b[1]+1.25,y:259.25,width:34.5,height:34.5,fill:'none',stroke:INK,'stroke-width':2.5});
      var t=el('text',{x:b[1]+18.5,y:250,'text-anchor':'middle','font-size':24,fill:INK,'font-family':'Noto Sans, sans-serif'}); t.textContent=b[0];
    });
    // front of the seat: vertical, or bevelled at 15 / 30 / 45 degrees
    var h=BOTTOM_Y-BEND_Y;
    if(tilt){
      var ex=FRONT_X+h*Math.tan(parseInt(tilt,10)*Math.PI/180);
      if(ex>POLE[0]){ // extend the post up to the bevel
        var yAt=function(x){return BEND_Y+(x-FRONT_X)/(ex-FRONT_X)*h;};
        el('path',{d:'M'+POLE[0]+','+yAt(POLE[0])+' L'+POLE[1]+','+Math.min(BOTTOM_Y,yAt(POLE[1]))+' L'+POLE[1]+',459 L'+POLE[0]+',459 Z',fill:FILL});
        el('path',{d:'M'+POLE[0]+','+yAt(POLE[0])+' V459 M'+POLE[1]+','+Math.min(BOTTOM_Y,yAt(POLE[1]))+' V459',stroke:INK,'stroke-width':2.2});
      }
      el('path',{d:'M'+FRONT_X+',398 V'+BEND_Y+' L'+ex.toFixed(1)+','+BOTTOM_Y+' H152',fill:'none',stroke:INK,'stroke-width':3.4,'stroke-linejoin':'round'});
    } else {
      el('path',{d:'M'+FRONT_X+',398 V'+BOTTOM_Y+' H152',fill:'none',stroke:INK,'stroke-width':3.4,'stroke-linejoin':'miter'});
      [15,30,45].forEach(function(a){
        var x=FRONT_X+2+(h-4)*Math.tan(a*Math.PI/180);
        el('path',{d:'M'+(FRONT_X+2.5)+','+(BEND_Y+1)+' L'+x.toFixed(1)+','+(BOTTOM_Y-3),stroke:INK,'stroke-width':2.3,'stroke-linecap':'round','stroke-dasharray':'0.5 6'});
      });
    }
  }

  /* ---------- build drawings ---------- */
  var wrap=$('#drawings');
  DRAWINGS.forEach(function(d){
    var fig=document.createElement('div'); fig.className='drawing';
    fig.innerHTML='<div class="cap">'+d.title+'</div>';
    var inner=document.createElement('div'); inner.style.position='relative';
    var img=document.createElement('img'); img.src=d.src; img.alt=d.title; img.width=d.w; img.height=d.h;
    inner.appendChild(img);
    d.fields.forEach(function(f){
      var b=f.box, box=document.createElement('div');
      box.className='fld'+(f.req?' is-req':'');
      box.style.left=pct(b[0],d.w); box.style.top=pct(b[1],d.h);
      box.style.width=pct(b[2]-b[0],d.w); box.style.height=pct(b[3]-b[1],d.h);
      var inp=document.createElement('input');
      inp.id='m_'+f.id; inp.inputMode='decimal'; inp.autocomplete='off';
      inp.setAttribute('aria-label',f.label+' ('+f.unit+')'+(f.req?' – required':''));
      inp.title=f.label+' ('+f.unit+')';
      inp.dataset.label=f.label; inp.dataset.unit=f.unit; inp.dataset.group=d.title;
      if(f.req) inp.required=true;
      inp.addEventListener('input',function(){
        inp.value=inp.value.replace(/[^0-9.,\-]/g,'');
        box.classList.toggle('has-value',!!inp.value.trim());
        inp.classList.remove('invalid');
      });
      box.appendChild(inp);
      if(f.req){var s=document.createElement('span'); s.className='star'; s.textContent='*'; box.appendChild(s);}
      inner.appendChild(box);
    });
    if(d.live){
      var svg=document.createElementNS(SVGNS,'svg');
      svg.setAttribute('class','live'); svg.setAttribute('viewBox','0 0 '+d.w+' '+d.h); svg.setAttribute('aria-hidden','true');
      inner.insertBefore(svg,img.nextSibling);
      liveSvg=svg;
    }
    (d.choices||[]).forEach(function(c){
      c.options.forEach(function(o,i){
        var b=o.box, t=document.createElement('div'); t.className='tilt';
        t.style.left=pct(b[0],d.w); t.style.top=pct(b[1],d.h);
        t.style.width=pct(b[2]-b[0],d.w); t.style.height=pct(b[3]-b[1],d.h);
        var id=c.name+'-'+i;
        t.innerHTML='<input type="radio" name="'+c.name+'" id="'+id+'" value="'+o.v+'"><label for="'+id+'" title="'+c.label+': '+o.v+'" aria-label="'+c.label+': '+o.v+'"></label>';
        // allow un-selecting by clicking the ticked box again
        var r=t.querySelector('input'), lb=t.querySelector('label');
        lb.addEventListener('mousedown',function(){r.dataset.was=r.checked?'1':'';});
        lb.addEventListener('click',function(e){ if(r.dataset.was){e.preventDefault(); r.checked=false; r.dataset.was=''; drawLive();}});
        r.addEventListener('change',drawLive);
        inner.appendChild(t);
      });
    });
    fig.appendChild(inner); wrap.appendChild(fig);
  });
  drawLive();

  /* one font size for all measurement boxes, scaled with the drawings */
  function sizeFonts(){
    var sc=Infinity;
    $$('#drawings .drawing img').forEach(function(im){ if(im.clientWidth) sc=Math.min(sc, im.clientWidth/im.naturalWidth || im.clientWidth/im.width); });
    if(!isFinite(sc)) return;
    wrap.style.setProperty('--mfs', Math.max(12,Math.min(18,17*sc)).toFixed(1)+'px');
  }
  window.addEventListener('resize',sizeFonts);
  if(window.ResizeObserver) new ResizeObserver(sizeFonts).observe(wrap);

  /* ---------- scale scan: width / offset only when a value is entered ---------- */
  var scale=$('#scale'), wo=$('#wo');
  scale.addEventListener('input',function(){
    scale.value=scale.value.replace(/[^0-9.,\-]/g,'');
    var has=!!scale.value.trim();
    wo.hidden=!has;
    if(!has) $$('input[name=scaleType]').forEach(function(r){r.checked=false;});
    wo.classList.remove('invalid');
  });

  /* ---------- validation ---------- */
  function isNum(v){return /^-?\d+([.,]\d+)?$/.test(v.trim());}
  function validate(step){
    var bad=[];
    if(step===1){
      $$('#step-1 [required]').forEach(function(i){ if(!i.value.trim()) bad.push(i); });
    }
    if(step===2){
      $$('#drawings input[required]').forEach(function(i){ if(!isNum(i.value)) bad.push(i); });
      $$('#drawings .fld input').forEach(function(i){ if(i.value.trim() && !isNum(i.value)) bad.push(i); });
      if(scale.value.trim() && !isNum(scale.value)) bad.push(scale);
      if(scale.value.trim() && !$('input[name=scaleType]:checked')) bad.push(wo);
    }
    if(step===3){
      if(!$('.card[aria-checked=true]')) bad.push($('.cards'));
    }
    return bad;
  }
  function showErrors(step,bad){
    var sec = step===2 ? $('#step-2b') : $('#step-'+step);
    var msg=$('.msg',sec);
    $$('.invalid').forEach(function(e){e.classList.remove('invalid');});
    if(!bad.length){msg.textContent='';return true;}
    bad.forEach(function(e){e.classList.add('invalid');});
    msg.textContent = step===3 ? 'Please pick a backing material.'
      : (step===2 && bad.indexOf(wo)>-1 && bad.length===1) ? 'Choose width or offset for the scale scan.'
      : 'Please fill in the required fields (*).';
    var first=bad[0]; if(first.focus) first.focus({preventScroll:true});
    first.scrollIntoView({behavior:'smooth',block:'center'});
    return false;
  }
  document.addEventListener('input',function(e){
    if(e.target.classList && e.target.classList.contains('invalid') && e.target.value.trim()) e.target.classList.remove('invalid');
  });
  document.addEventListener('change',function(e){
    if(e.target.name==='scaleType') wo.classList.remove('invalid');
  });

  /* ---------- navigation ---------- */
  var TITLES={1:'Customize your seating.',2:'Customize your seating.',3:'Pick your backing material.'};
  var current=1;
  function go(n){
    current=n;
    document.body.className='step-'+n;
    $$('.step').forEach(function(s){s.classList.remove('active');});
    $('#step-'+n).classList.add('active');
    if(n===2) $('#step-2b').classList.add('active');
    $$('.tab').forEach(function(t){
      var on=+t.dataset.go===n; t.classList.toggle('active',on); t.setAttribute('aria-selected',on);
    });
    $('#title').textContent=TITLES[n];
    $$('.msg').forEach(function(m){m.textContent='';});
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function tryGo(target){
    for(var s=1;s<target;s++){
      var bad=validate(s);
      if(bad.length){ if(s!==current) go(s); showErrors(s,bad); return; }
    }
    go(target);
  }
  $$('[data-next]').forEach(function(b){ b.addEventListener('click',function(){ tryGo(+b.dataset.next); }); });
  $$('.tab').forEach(function(t){ t.addEventListener('click',function(){
    var n=+t.dataset.go; if(n<=current) go(n); else tryGo(n);
  }); });

  /* ---------- backing material cards ---------- */
  var cards=$$('.card');
  function pick(c){
    cards.forEach(function(x){x.setAttribute('aria-checked',x===c?'true':'false');x.tabIndex=x===c?0:-1;});
    $('.cards').classList.remove('invalid'); $('#step-3 .msg').textContent='';
  }
  cards.forEach(function(c,i){
    c.tabIndex=i===0?0:-1;
    c.addEventListener('click',function(){pick(c);});
    c.addEventListener('keydown',function(e){
      var k=e.key, j=null;
      if(k==='ArrowRight'||k==='ArrowDown') j=(i+1)%cards.length;
      if(k==='ArrowLeft'||k==='ArrowUp') j=(i+cards.length-1)%cards.length;
      if(j!==null){e.preventDefault(); pick(cards[j]); cards[j].focus();}
    });
  });

  /* ---------- helpers ---------- */
  function radio(n){var e=$('input[name="'+n+'"]:checked'); return e?e.value:'';}

  /* ---------- Select: open the configurator for the chosen backing material in a new tab ---------- */
  $('#finish').addEventListener('click',function(){
    for(var s=1;s<=3;s++){ var bad=validate(s); if(bad.length){ if(s!==current) go(s); showErrors(s,bad); return; } }
    var url=$('.card[aria-checked=true]').dataset.url;
    var w=window.open(url,'_blank');
    if(w){ try{ w.opener=null; }catch(e){} }
    else window.location.href=url; // pop-up blocked: open in this tab instead
  });
})();
</script>
</body>
</html>
